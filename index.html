<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!--
  Content Security Policy: defense in depth.
  * default-src none  : nothing loads unless explicitly allowed below.
  * script-src sha256  : ONLY this app's own inline code (pinned by a cryptographic
                         hash) may run. Any injected or swapped-in code, plus dynamic
                         code execution, is refused by the browser.
  * connect-src none  : no network requests of any kind, so the app cannot phone home
                        or send the child's data anywhere. (Standard Notes save/load
                        uses postMessage, which CSP does not restrict, so it still works.)
  * img/font/object/etc none : no external or data resources are loaded.
  * base-uri / form-action none : block base-tag and form hijacking tricks.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-/VdHW3ei03/ZOHjklpIUrRicNp4gJPUu8UXdlplnX1g='; style-src 'unsafe-inline'; img-src 'none'; font-src 'none'; media-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; child-src 'none'; worker-src 'none'; object-src 'none'; manifest-src 'none'" />
<meta name="referrer" content="no-referrer" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Math Tutor</title>
<style>
  :root{
    /* These fall back for standalone use; Standard Notes overrides them with the active theme. */
    --bg: var(--sn-stylekit-background-color, #f7f9fc);
    --fg: var(--sn-stylekit-foreground-color, #1f2937);
    --panel: var(--sn-stylekit-contrast-background-color, #ffffff);
    --border: var(--sn-stylekit-border-color, #e3e8ef);
    --muted: var(--sn-stylekit-neutral-color, #6b7280);
    --font: var(--sn-stylekit-editor-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif);
    /* Fun accents (kid palette) */
    --accent:#3b82f6; --accent2:#8b5cf6; --good:#16a34a; --good-bg:#dcfce7;
    --bad:#d97706; --bad-bg:#fef3c7; --star:#f59e0b; --shadow:0 2px 0 rgba(0,0,0,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg); color:var(--fg); font-family:var(--font);
    -webkit-text-size-adjust:100%; line-height:1.35;
  }
  #root{max-width:680px;margin:0 auto;padding:16px 14px 28px}

  /* ---------- Home ---------- */
  .hero{text-align:center;padding:10px 6px 14px}
  .hero-title{font-size:1.5rem;font-weight:800}
  .hero-stars{margin-top:6px;font-size:1.05rem;color:var(--muted)}
  .hero-stars b{color:var(--star)}
  .section{font-size:1.05rem;margin:18px 4px 8px;font-weight:800}
  .section .sub{font-weight:500;color:var(--muted);font-size:.85rem}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media(min-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}
  .card{
    appearance:none;border:2px solid var(--border);background:var(--panel);color:var(--fg);
    border-radius:18px;padding:14px 10px 12px;cursor:pointer;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:var(--shadow);
    transition:transform .06s ease, border-color .15s;
  }
  .card:active{transform:translateY(2px) scale(.98)}
  .card:hover{border-color:var(--accent)}
  .card-emoji{font-size:2.1rem;line-height:1}
  .card-label{font-weight:800;font-size:1.02rem}
  .card-level{display:flex;gap:4px;margin-top:2px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--border)}
  .dot.on{background:var(--accent)}
  .card-meta{font-size:.78rem;color:var(--muted)}
  .testlink{
    margin-top:8px;font-size:.74rem;border:none;background:transparent;color:var(--accent2);
    cursor:pointer;text-decoration:underline;padding:4px;
  }
  .parent-note{margin:22px 6px 0;font-size:.82rem;color:var(--muted);text-align:center}

  /* ---------- Practice ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
  .back,.hint{
    appearance:none;border:2px solid var(--border);background:var(--panel);color:var(--fg);
    border-radius:12px;padding:8px 12px;font-size:.9rem;font-weight:700;cursor:pointer;
  }
  .hint{border-color:#fcd34d;background:#fffbeb;color:#92400e}
  .topic-name{font-weight:800;font-size:1.05rem}
  .practbar,.testbar{
    text-align:center;font-size:.85rem;color:var(--muted);margin:2px 0 10px;
    background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:5px 10px
  }
  .testbar{color:var(--accent2);border-color:var(--accent2)}
  .practbar{display:flex;align-items:center;justify-content:center;gap:10px}
  .lvlbtn{appearance:none;cursor:pointer;border:2px solid var(--accent);background:var(--panel);
    color:var(--accent);font-weight:800;border-radius:10px;width:34px;height:34px;font-size:1rem;line-height:1}
  .lvlbtn:active{transform:translateY(1px)}
  .lvlbtn:disabled{opacity:.3;cursor:default;border-color:var(--border);color:var(--muted)}
  .lvltxt{font-weight:800;color:var(--fg);font-size:.95rem;min-width:86px}
  .lvlmax{color:var(--muted);font-weight:600}
  .practstars{color:var(--star);font-weight:700}
  .prompt{
    background:var(--panel);border:2px solid var(--border);border-radius:20px;
    padding:26px 18px;text-align:center;font-size:2rem;font-weight:800;
    min-height:96px;display:flex;align-items:center;justify-content:center;line-height:1.25;
  }
  .hintbox{margin-top:10px;background:#fffbeb;border:2px solid #fcd34d;color:#92400e;
    border-radius:14px;padding:12px 14px;font-size:1rem}

  /* number answer + pad */
  .answerbox{
    margin:14px auto 10px;width:min(280px,90%);text-align:center;font-size:2.4rem;font-weight:800;
    border:3px dashed var(--accent);border-radius:16px;padding:10px;min-height:64px;background:var(--panel)
  }
  .answerbox .ph{color:var(--border)}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:340px;margin:0 auto}
  .key{
    appearance:none;border:2px solid var(--border);background:var(--panel);color:var(--fg);
    font-size:1.6rem;font-weight:800;border-radius:16px;padding:16px 0;cursor:pointer;
    box-shadow:var(--shadow);min-height:60px
  }
  .key:active{transform:translateY(2px)}
  .key.go{background:var(--good);border-color:var(--good);color:#fff}
  .key.del{background:#f3f4f6;color:#374151}

  /* choices */
  .choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
  .choice{
    appearance:none;border:2px solid var(--accent);background:var(--panel);color:var(--fg);
    font-size:1.7rem;font-weight:800;border-radius:16px;padding:22px 8px;cursor:pointer;box-shadow:var(--shadow)
  }
  .choice:active{transform:translateY(2px)}

  /* feedback */
  .feedback{margin-top:16px;border-radius:18px;padding:16px 16px;border:2px solid}
  .feedback.ok{background:var(--good-bg);border-color:var(--good)}
  .feedback.no{background:var(--bad-bg);border-color:var(--bad)}
  .cheer{font-size:1.4rem;font-weight:800;text-align:center}
  .correct-answer{text-align:center;margin-top:6px;font-size:1.1rem}
  .why{margin-top:12px;font-size:1.02rem;background:rgba(255,255,255,.6);border-radius:12px;padding:12px}
  .levelup{margin-top:12px;text-align:center;font-weight:800;color:var(--good);font-size:1.1rem}
  .leveldown{margin-top:12px;text-align:center;font-weight:700;color:var(--bad)}
  .next{
    display:block;width:100%;margin-top:16px;appearance:none;border:none;cursor:pointer;
    background:var(--accent);color:#fff;font-size:1.2rem;font-weight:800;border-radius:16px;padding:16px;box-shadow:var(--shadow)
  }
  .next:active{transform:translateY(2px)}
  .adjust{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:12px}
  .adjlbl{font-size:.85rem;color:var(--muted);width:100%;text-align:center}
  .adjbtn{appearance:none;cursor:pointer;border:2px solid var(--accent2);background:var(--panel);
    color:var(--accent2);font-weight:800;border-radius:12px;padding:10px 16px;font-size:1rem}
  .adjbtn:active{transform:translateY(1px)}
  .adjbtn:disabled{opacity:.35;cursor:default;border-color:var(--border);color:var(--muted)}

  /* test done */
  .done{text-align:center;padding:18px 8px}
  .done-emoji{font-size:3rem}
  .done-title{font-size:1.4rem;font-weight:800;margin-top:6px}
  .done-score{margin-top:8px;font-size:1.1rem}
  .done-level{margin-top:6px;font-size:1.1rem;color:var(--accent2)}
  .done .next{margin-top:18px}
  .done .hint{display:inline-block;margin-top:12px}

  /* ---------- Progress report ---------- */
  .grownups{
    display:block;width:100%;margin:18px auto 0;appearance:none;cursor:pointer;
    border:2px solid var(--border);background:var(--panel);color:var(--muted);
    border-radius:14px;padding:12px;font-size:.9rem;font-weight:700
  }
  .grownups:hover{border-color:var(--accent2);color:var(--accent2)}
  .report .topbar span{width:54px}
  .stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 14px}
  .stat{background:var(--panel);border:2px solid var(--border);border-radius:16px;padding:12px 6px;text-align:center}
  .statnum{font-size:1.35rem;font-weight:800}
  .statlbl{font-size:.78rem;color:var(--muted);margin-top:2px}
  .callouts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:460px){.callouts{grid-template-columns:1fr}}
  .callout{border-radius:16px;padding:12px;border:2px solid}
  .callout.good{background:var(--good-bg);border-color:var(--good)}
  .callout.focus{background:var(--bad-bg);border-color:var(--bad)}
  .co-h{font-weight:800;font-size:.95rem;margin-bottom:8px}
  .co-b{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:.85rem;font-weight:700;background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:5px 10px}
  .rlist{display:flex;flex-direction:column;gap:10px}
  .rrow{background:var(--panel);border:2px solid var(--border);border-radius:14px;padding:11px 13px}
  .rtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .rname{font-weight:800}
  .stretchtag{font-size:.68rem;font-weight:700;color:var(--accent2);border:1px solid var(--accent2);border-radius:6px;padding:1px 5px;vertical-align:middle}
  .rlvl{font-size:.85rem;color:var(--muted);white-space:nowrap}
  .rbest{color:var(--good)}
  .rbar{height:10px;background:var(--border);border-radius:999px;margin:8px 0 6px;overflow:hidden}
  .rfill{height:100%;border-radius:999px;background:var(--muted);transition:width .3s}
  .rfill.hi{background:var(--good)} .rfill.mid{background:var(--accent)} .rfill.lo{background:var(--bad)}
  .rmeta{font-size:.8rem;color:var(--muted)}
  .empty{margin:30px 8px;text-align:center;color:var(--muted);font-size:1.05rem;line-height:1.5}
  .resetwrap{margin-top:20px;text-align:center}
  .resetbtn{appearance:none;cursor:pointer;border:2px solid var(--border);background:transparent;
    color:var(--muted);border-radius:12px;padding:9px 14px;font-size:.85rem;font-weight:700}
  .resetbtn:hover{border-color:var(--bad);color:var(--bad)}
  .resetconfirm{background:var(--bad-bg);border:2px solid var(--bad);border-radius:14px;padding:14px;
    font-weight:700;color:#92400e}
  .resetconfirm>div{margin-top:10px;display:flex;gap:10px;justify-content:center}
  .danger{appearance:none;cursor:pointer;border:none;background:#dc2626;color:#fff;font-weight:800;
    border-radius:12px;padding:9px 16px;font-size:.9rem}

  /* ---------- Grade selector ---------- */
  .gradewrap{margin:6px 0 4px;text-align:center}
  .gradelbl{display:block;font-size:.8rem;color:var(--muted);font-weight:700;margin-bottom:6px}
  .grades{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .gchip{appearance:none;cursor:pointer;border:2px solid var(--border);background:var(--panel);
    color:var(--fg);font-weight:800;border-radius:999px;min-width:40px;padding:7px 10px;font-size:.9rem}
  .gchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .gchip:active{transform:translateY(1px)}

  /* compact level bar on topic cards */
  .card-bar{width:80%;height:7px;background:var(--border);border-radius:999px;overflow:hidden;margin:2px 0}
  .card-fill{height:100%;background:var(--accent);border-radius:999px}

  /* big buttons (Tutorials) */
  .bigbtn{display:block;width:100%;margin:18px 0 0;appearance:none;cursor:pointer;border:2px solid var(--accent2);
    background:var(--panel);color:var(--accent2);font-size:1.05rem;font-weight:800;border-radius:16px;padding:15px;box-shadow:var(--shadow)}
  .bigbtn:active{transform:translateY(2px)}

  /* ---------- Tutorials browser ---------- */
  .seg-row{display:flex;gap:8px;justify-content:center;margin:12px 0}
  .seg{appearance:none;cursor:pointer;border:2px solid var(--border);background:var(--panel);color:var(--muted);
    font-weight:800;border-radius:12px;padding:8px 14px;font-size:.9rem}
  .seg.on{border-color:var(--accent2);color:var(--accent2)}
  .llist{display:flex;flex-direction:column;gap:10px}
  .lcard{display:flex;align-items:center;gap:12px;text-align:left;appearance:none;cursor:pointer;
    border:2px solid var(--border);background:var(--panel);color:var(--fg);border-radius:16px;padding:13px 14px;box-shadow:var(--shadow)}
  .lcard:hover{border-color:var(--accent2)}
  .lcard:active{transform:translateY(2px)}
  .lemoji{font-size:1.8rem;line-height:1}
  .ltext{display:flex;flex-direction:column;flex:1;gap:2px}
  .ltitle{font-weight:800;font-size:1.02rem}
  .ldone{color:var(--good);font-size:.8rem;font-weight:800}
  .lgrades{font-size:.78rem;color:var(--muted)}
  .lgo{font-size:1.6rem;color:var(--muted);font-weight:800}

  /* ---------- Lesson viewer ---------- */
  .sdots{display:flex;gap:6px;justify-content:center;margin:6px 0 12px}
  .sdot{width:9px;height:9px;border-radius:50%;background:var(--border)}
  .sdot.on{background:var(--accent2)}
  .sdot.past{background:var(--good)}
  .lessfig{background:var(--panel);border:2px solid var(--border);border-radius:16px;padding:10px;margin-bottom:14px}
  .lessvg{display:block;width:100%;height:auto}
  .lesstext{font-size:1.12rem;line-height:1.5;text-align:center;padding:0 4px}
  .lessnav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px}
  .lnav{appearance:none;cursor:pointer;border:2px solid var(--accent);background:var(--panel);color:var(--accent);
    font-weight:800;border-radius:14px;padding:13px 20px;font-size:1.05rem}
  .lnav.next,.lnav.done{background:var(--accent);color:#fff}
  .lnav.done{background:var(--good);border-color:var(--good)}
  .lnav:active{transform:translateY(2px)}
  .practice-this{display:block;width:100%;margin-top:14px;appearance:none;cursor:pointer;border:2px solid var(--accent2);
    background:var(--panel);color:var(--accent2);font-weight:800;border-radius:14px;padding:13px;font-size:1rem}

  .key.wide{width:100%;margin-top:10px;max-width:340px;margin-left:auto;margin-right:auto;display:block}
  .key.dot:disabled{opacity:.3;cursor:default}
  .key.neg{background:#eef2ff;color:var(--accent2);font-weight:900}

  /* v3: ask, sprint, badges, settings */
  .toast{background:#fffbeb;border:2px solid var(--gold,#f59e0b);color:#92400e;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-weight:800;text-align:center}
  .homerow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  .bigbtn{display:block;width:100%;appearance:none;cursor:pointer;border:2px solid var(--accent2);background:var(--panel);
    color:var(--accent2);font-size:1.02rem;font-weight:800;border-radius:16px;padding:14px;box-shadow:var(--shadow)}
  .bigbtn.ask{border-color:var(--accent);color:var(--accent)}
  .bigbtn:active{transform:translateY(2px)}
  .homerow .bigbtn{margin-top:0}
  .topic-name{font-weight:800;font-size:1.05rem}
  .askinput{width:100%;font-size:1.1rem;padding:14px;border:2px solid var(--accent);border-radius:14px;margin:6px 0 10px;font-family:inherit}
  .askinput:focus{outline:3px solid #bcd2f2}
  .wideb{display:block;width:100%}
  .examples{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chip2{border:2px solid var(--border);background:var(--panel);color:var(--muted);font-weight:700;border-radius:999px;padding:7px 12px;cursor:pointer;font-size:.85rem}
  .chip2:hover{border-color:var(--accent2);color:var(--accent2)}
  .answercard{margin-top:16px;background:var(--panel);border:2px solid var(--good,#16a34a);border-radius:16px;padding:16px;text-align:center}
  .acq{font-size:1.1rem;color:var(--muted)}
  .acv{font-size:2.2rem;font-weight:800;color:var(--good,#16a34a);margin:4px 0 8px}
  .acx{font-size:1rem;line-height:1.5;text-align:left;background:rgba(0,0,0,.03);border-radius:12px;padding:12px}
  .sprintbar{display:flex;justify-content:space-between;align-items:center;max-width:340px;margin:2px auto 10px;font-weight:800;font-size:1.1rem}
  .badges{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .badge2{display:flex;align-items:center;gap:8px;border:2px solid var(--border);border-radius:12px;padding:8px 10px;color:var(--muted);opacity:.7}
  .badge2.got{opacity:1;color:var(--fg);border-color:var(--gold,#f59e0b);background:var(--panel)}
  .b2e{font-size:1.3rem}.b2n{font-size:.82rem;font-weight:700}
  .toggles{display:flex;flex-direction:column;gap:8px}
  .toggle{display:flex;align-items:center;justify-content:space-between;border:2px solid var(--border);background:var(--panel);color:var(--fg);border-radius:12px;padding:12px 14px;font-weight:700;cursor:pointer}
  .toggle.on{border-color:var(--good,#16a34a)}
  .toggle .sw{font-size:.78rem;font-weight:800;color:var(--muted);border:2px solid var(--border);border-radius:999px;padding:2px 10px}
  .toggle.on .sw{color:#fff;background:var(--good,#16a34a);border-color:var(--good,#16a34a)}
  .bigbtn.quest{border-color:#16a34a;color:#16a34a}
  .bigbtn.mastery{border-color:var(--star);color:#b45309}
  /* ---------- Quest strip on home ---------- */
  .queststrip{display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;appearance:none;cursor:pointer;
    border:2px solid var(--border);background:var(--panel);border-radius:14px;padding:8px 12px;box-shadow:var(--shadow)}
  .qs-badge{font-size:1.5rem}
  .qs-mid{flex:1;display:flex;flex-direction:column;gap:4px;text-align:left}
  .qs-name{font-weight:800;font-size:.9rem}
  .qs-bar{height:9px;background:var(--border);border-radius:999px;overflow:hidden}
  .qs-fill{display:block;height:100%;background:linear-gradient(90deg,#16a34a,#22c55e);border-radius:999px}
  .qs-pts{font-weight:800;color:#16a34a;font-size:.85rem;white-space:nowrap}
  /* ---------- Quest Board ---------- */
  .note2{font-size:.86rem;color:var(--muted);line-height:1.5;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin:6px 0}
  .empty2{color:var(--muted);font-size:.9rem;text-align:center;padding:8px}
  .levelcard{display:flex;align-items:center;gap:14px;background:var(--panel);border:2px solid #16a34a;border-radius:18px;padding:14px;box-shadow:var(--shadow)}
  .lvlbadge{font-size:2.6rem}
  .lvlinfo{flex:1}
  .lvlname{font-weight:800;font-size:1.05rem}
  .lvlbar{height:14px;background:var(--border);border-radius:999px;overflow:hidden;margin:6px 0}
  .lvlfill{height:100%;background:linear-gradient(90deg,#16a34a,#4ade80);border-radius:999px;transition:width .4s}
  .lvlsub{font-size:.84rem;color:var(--muted)}
  .qgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .qclaim{display:flex;align-items:center;gap:8px;appearance:none;cursor:pointer;border:2px solid var(--border);
    background:var(--panel);color:var(--fg);border-radius:14px;padding:12px;font-weight:700;text-align:left;box-shadow:var(--shadow)}
  .qclaim:hover{border-color:#16a34a}
  .qclaim:active{transform:translateY(2px)}
  .qem{font-size:1.3rem}
  .qlb{flex:1;font-size:.9rem}
  .qpts{font-weight:800;color:#16a34a;font-size:.85rem}
  .qpendlist,.qloglist{display:flex;flex-direction:column;gap:8px}
  .qpend{display:flex;align-items:center;justify-content:space-between;gap:8px;border:2px dashed var(--bad,#d97706);
    background:var(--bad-bg,#fef3c7);border-radius:12px;padding:10px 12px}
  .qpend .qlb small{color:var(--muted);font-weight:700}
  .qpbtns,.qapprove{display:flex;align-items:center;gap:6px}
  .mini{appearance:none;cursor:pointer;border:2px solid var(--border);background:var(--panel);color:var(--fg);
    font-weight:800;border-radius:10px;padding:6px 10px;font-size:.82rem}
  .mini.ok{border-color:#16a34a;color:#16a34a}
  .pinp{width:78px;border:2px solid var(--accent);border-radius:10px;padding:6px 8px;font-size:1rem;font-family:inherit;text-align:center;letter-spacing:2px}
  .pinrow{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
  .pinok{color:#16a34a;font-weight:800;font-size:.85rem}
  .qlog{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:.9rem}
  /* ---------- Mastery ---------- */
  .mcounts{display:flex;justify-content:center;gap:14px;font-weight:800;font-size:1.15rem;margin:6px 0 4px}
  .mlist{display:flex;flex-direction:column;gap:10px}
  .mcard{border:2px solid var(--border);background:var(--panel);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
  .mhead{display:flex;align-items:center;gap:8px}
  .mem{font-size:1.3rem}
  .mlbl{flex:1;font-weight:800}
  .mtier{font-size:.8rem;font-weight:800;border-radius:999px;padding:3px 10px;border:2px solid var(--border);color:var(--muted)}
  .mtier.t1{color:#b45309;border-color:#d8a26a;background:#fdf3e7}
  .mtier.t2{color:#64748b;border-color:#cbd5e1;background:#f1f5f9}
  .mtier.t3{color:#b8860b;border-color:#f0c64a;background:#fef9e7}
  .mtier.t4{color:#0ea5e9;border-color:#7dd3fc;background:#e8f7fe}
  .mbar{height:12px;background:var(--border);border-radius:999px;overflow:hidden;margin:8px 0}
  .mfill{height:100%;border-radius:999px;background:var(--muted);transition:width .4s}
  .mfill.t1{background:#d8a26a}.mfill.t2{background:#94a3b8}.mfill.t3{background:#f0c64a}.mfill.t4{background:#38bdf8}
  .mmeta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);font-weight:700}
  /* ---------- Celebration ---------- */
  .celebrate{position:relative;overflow:hidden;text-align:center;background:linear-gradient(135deg,#16a34a,#22c55e);
    color:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);animation:pop .35s ease-out}
  .celeb-t{font-size:1.15rem;font-weight:800}
  .celeb-s{font-size:.9rem;opacity:.95;margin-top:2px}
  .confetti{position:absolute;top:8px;font-size:1.4rem;animation:rise 1s ease-out}
  .confetti.r{right:12px}.confetti:not(.r){left:12px}
  @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes rise{from{transform:translateY(6px) rotate(0)}to{transform:translateY(-4px) rotate(18deg)}}

  /* ---------- Games ---------- */
  .section .sub{font-weight:600;color:var(--muted);font-size:.85rem}
  .gamegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .gtile{appearance:none;cursor:pointer;border:2px solid var(--border);background:var(--panel);color:var(--fg);border-radius:16px;padding:14px 10px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
  .gtile:active{transform:translateY(2px)}
  .gtile .ge{font-size:1.9rem}.gtile .gt{font-weight:800;font-size:.95rem}.gtile .gs{font-size:.72rem;color:var(--muted)}
  .g-monsters{border-color:#ef4444}.g-makeit{border-color:#f59e0b}.g-art{border-color:#8b5cf6}.g-maze{border-color:#06b6d4}.g-detective{border-color:#16a34a}
  .game{max-width:520px;margin:0 auto}
  .gprompt{font-size:1.6rem;font-weight:800;text-align:center;background:var(--panel);border:2px solid var(--border);border-radius:16px;padding:16px;margin:10px 0}
  .gopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .gopt{appearance:none;cursor:pointer;border:2px solid var(--border);background:var(--panel);color:var(--fg);font-weight:800;font-size:1.3rem;border-radius:14px;padding:16px;box-shadow:var(--shadow)}
  .gopt:hover{border-color:var(--accent)}.gopt:active{transform:translateY(2px)}
  .ghint{text-align:center;color:var(--muted);font-size:.82rem;margin-top:10px}
  .gmsg{text-align:center;font-weight:800;margin:8px 0}.gmsg.big{font-size:1.4rem}
  .btnrow2{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .ghost2{appearance:none;cursor:pointer;border:2px solid var(--border);background:var(--panel);color:var(--fg);font-weight:800;border-radius:12px;padding:10px 16px}
  .wide2{display:block;width:100%;margin-top:12px}
  .gover{text-align:center;padding:24px 10px}.goe{font-size:3.5rem}.got{font-size:1.4rem;font-weight:800;margin-top:6px}.gos{color:var(--muted);margin-top:6px}
  /* monsters */
  .arena{background:linear-gradient(160deg,#1f2937,#111827);border-radius:18px;padding:14px;color:#fff;box-shadow:var(--shadow)}
  .bossrow{display:flex;justify-content:space-between;font-weight:800;font-size:.9rem}
  .boss{text-align:center;margin-top:6px}
  .bossemoji{font-size:4rem;line-height:1;filter:drop-shadow(0 0 12px var(--bc))}
  .bossemoji.hit{animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .bossname{font-weight:800;margin:2px 0 6px}
  .hpbar{height:16px;background:rgba(255,255,255,.15);border-radius:999px;overflow:hidden}
  .hpfill{height:100%;background:linear-gradient(90deg,#ef4444,#f59e0b);transition:width .3s}
  .combo{text-align:center;color:#fdba74;font-weight:800;margin-top:8px}
  .gmsg.light{color:#fff}
  .boss{position:relative}
  .floatdmg{position:absolute;left:50%;top:0;transform:translateX(-50%);font-weight:900;font-size:1.6rem;color:#fca5a5;animation:floatup .7s ease-out forwards;pointer-events:none}
  .floatdmg.crit{font-size:2.1rem;color:#fde047}
  @keyframes floatup{from{opacity:1;transform:translate(-50%,10px) scale(.8)}to{opacity:0;transform:translate(-50%,-38px) scale(1.3)}}
  .mazebar{text-align:center;font-weight:800;color:var(--muted);margin:4px 0 8px}
  .swatch.rainbow{background:conic-gradient(#ef4444,#f59e0b,#16a34a,#3b82f6,#8b5cf6,#ef4444);display:flex;align-items:center;justify-content:center;font-size:1rem}
  .clues li:nth-child(3n+1){border-color:#c7d2fe;background:#eef2ff}
  .clues li:nth-child(3n+2){border-color:#bbf7d0;background:#f0fdf4}
  .clues li:nth-child(3n+3){border-color:#fed7aa;background:#fff7ed}
  /* make-it */
  .target{text-align:center;font-size:1.5rem;font-weight:800;margin:6px 0}.target b{color:var(--accent);font-size:2rem}
  .mcards{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
  .mkcard{appearance:none;cursor:pointer;border:3px solid var(--border);background:var(--panel);color:var(--fg);font-weight:800;font-size:1.6rem;border-radius:14px;min-width:64px;padding:16px;box-shadow:var(--shadow)}
  .mkcard.sel{border-color:var(--accent);background:#eef2ff;transform:translateY(-3px)}
  .mops{display:flex;gap:10px;justify-content:center}
  .mop{appearance:none;cursor:pointer;border:2px solid var(--border);background:var(--panel);color:var(--fg);font-weight:800;font-size:1.4rem;border-radius:12px;width:52px;height:52px}
  .mop.sel{border-color:var(--accent2,#16a34a);background:#dcfce7}
  /* art */
  .artstage{text-align:center}.artsvg{width:100%;max-width:340px;background:var(--panel);border:2px solid var(--border);border-radius:18px;box-shadow:var(--shadow)}
  .artfact{text-align:center;color:var(--muted);font-size:.85rem;margin:8px 0}
  .artctrl{display:flex;align-items:center;justify-content:center;gap:12px;margin:6px 0}.artlbl{font-weight:800;min-width:130px;text-align:center}
  .swatches{display:flex;gap:10px;justify-content:center;margin:12px 0}
  .swatch{width:34px;height:34px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 2px var(--border);cursor:pointer}
  .swatch.sel{box-shadow:0 0 0 3px var(--accent)}
  /* maze */
  .mazestage{text-align:center}.mazesvg{width:100%;max-width:340px}
  .dpad{display:flex;flex-direction:column;align-items:center;gap:8px;margin:12px 0}
  .dmid{display:flex;gap:60px}
  .dbtn{appearance:none;cursor:pointer;border:2px solid var(--accent);background:var(--panel);color:var(--accent);font-size:1.5rem;font-weight:800;border-radius:14px;width:60px;height:56px;box-shadow:var(--shadow)}
  .dbtn:active{transform:translateY(2px)}
  .gate{margin-top:10px}
  /* detective */
  .detmsg{text-align:center;font-size:1.05rem;margin:8px 0}
  .clues{list-style:none;padding:0;margin:10px 0;display:flex;flex-direction:column;gap:8px}
  .clues li{background:var(--panel);border:2px solid var(--border);border-radius:12px;padding:10px 14px;font-weight:600}
  .guessbox{text-align:center;font-size:2.4rem;font-weight:800;color:var(--accent);border:3px dashed var(--border);border-radius:16px;padding:8px;margin:10px 0;min-height:56px}
  .detpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .dkey{appearance:none;cursor:pointer;border:2px solid var(--border);background:var(--panel);color:var(--fg);font-weight:800;font-size:1.3rem;border-radius:12px;padding:14px;box-shadow:var(--shadow)}
  .dkey.go{background:var(--good,#16a34a);border-color:var(--good,#16a34a);color:#fff}
  .hist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
  .hchip{font-weight:800;font-size:.85rem;border-radius:999px;padding:4px 10px;border:2px solid var(--border)}
  .hchip.higher{color:#2563eb;border-color:#bfdbfe}.hchip.lower{color:#b45309;border-color:#fed7aa}.hchip.correct{color:#16a34a;border-color:#bbf7d0}
  .opts.durs{margin-bottom:4px}
  .opt.on{border-color:var(--accent);color:var(--accent);font-weight:800}
  .opt.mix{border-color:#16a34a;color:#16a34a}
  .sech{font-size:.95rem;font-weight:800;margin:14px 4px 8px}
  .sprintbar .lowtime{color:#d97706;animation:sprintpulse .8s infinite}
  @keyframes sprintpulse{50%{opacity:.4}}
</style>

omething into, the SMALLER each piece. 1/2 is bigger than 1/4.",svg:Oe(1,2,1,4,"1/2","1/4")}]},{id:"frac_equiv",title:"Equivalent Fractions",emoji:"\u{1F370}",grades:[3,4,5],topic:"fracmath",steps:[{text:"Different fractions can be the same amount. Look: 1/2 and 2/4 cover the same space.",svg:Oe(1,2,2,4,"1/2","2/4")},{text:"To make an equivalent fraction, multiply the top AND bottom by the same number. 1/2 \xD72/2 = 2/4.",svg:Oe(2,4,3,6,"2/4","3/6")},{text:"1/2 = 2/4 = 3/6 = 4/8 \u2026 they're all 'one half'. Equal moves on top and bottom keep the value.",svg:Ke(4,8,"4/8 = 1/2")}]},{id:"frac_add",title:"Adding Fractions",emoji:"\u2795",grades:[4,5],topic:"fracmath",steps:[{text:"If the bottoms match, just add the tops. 1/5 + 2/5: add 1 + 2 = 3 fifths.",svg:Ke(3,5,"1/5 + 2/5 = 3/5")},{text:"If the bottoms are different, first make them match. For 1/2 + 1/4, rewrite 1/2 as 2/4.",svg:Oe(1,2,2,4,"1/2","= 2/4")},{text:"Now 2/4 + 1/4 = 3/4. Same bottom, add the tops.",svg:Ke(3,4,"2/4 + 1/4 = 3/4")}]},{id:"decimals",title:"Decimals & Place Value",emoji:"\u{1F51F}",grades:[4,5],topic:"decimal",steps:[{text:"A decimal is another way to write parts of a whole. The grid has 100 squares; 0.50 fills half.",svg:le(50,"0.50 = 50 of 100")},{text:"0.25 means 25 hundredths \u2014 a quarter of the grid.",svg:le(25,"0.25 = 25 of 100")},{text:"On a number line, decimals live between the whole numbers. 0.5 sits halfway between 0 and 1.",svg:G(0,2,[{v:.5,label:"0.5"},{v:1.5,label:"1.5",color:"var(--accent2)"}])}]},{id:"fdp",title:"Fractions = Decimals = Percents",emoji:"\u{1F4AF}",grades:[5,6],topic:"percent",steps:[{text:"These are three ways to say the SAME amount. Half the grid: 1/2 = 0.5 = 50%.",svg:le(50,"1/2 = 0.5 = 50%")},{text:"A quarter of the grid: 1/4 = 0.25 = 25%. 'Percent' just means 'out of 100'.",svg:le(25,"1/4 = 0.25 = 25%")},{text:"To find a percent OF a number, multiply. 25% of 80 = 0.25 \xD7 80 = 20.",svg:le(25,"25% of 80 = 20")}]},{id:"pemdas",title:"Order of Operations",emoji:"\u{1F9E9}",grades:[4,5,6],topic:"order",steps:[{text:"When a problem mixes operations, there's an order. Do Parentheses first, then \xD7 and \xF7, then + and \u2212.",svg:F(A(320/2,55,"( )  \u2192  \xD7 \xF7  \u2192  + \u2212",{size:18,fill:y.a})+A(320/2,90,"Parentheses, then multiply/divide,",{size:12,fill:y.mut,weight:600})+A(320/2,108,"then add/subtract",{size:12,fill:y.mut,weight:600}),130)},{text:"Example: 2 + 3 \xD7 4. Multiplication comes first: 3 \xD7 4 = 12. THEN add: 2 + 12 = 14 (not 20!).",svg:F(A(320/2,50,"2 + 3 \xD7 4",{size:20})+A(320/2,80,"= 2 + 12",{size:16,fill:y.a})+A(320/2,106,"= 14",{size:20,fill:y.good}),130)},{text:"Parentheses jump the line: (2 + 3) \xD7 4 = 5 \xD7 4 = 20. The brackets get done first.",svg:F(A(320/2,50,"(2 + 3) \xD7 4",{size:20})+A(320/2,80,"= 5 \xD7 4",{size:16,fill:y.a})+A(320/2,106,"= 20",{size:20,fill:y.good}),130)}]},{id:"equations",title:"Solving for x",emoji:"\u2696\uFE0F",grades:[6,7],topic:"equation",steps:[{text:"An equation is a balance scale: both sides are equal. Solving means finding the mystery number x.",svg:Le("x + 3","7")},{text:"Keep it balanced: whatever you do to one side, do to the other. Subtract 3 from BOTH sides.",svg:Le("x","7 \u2212 3")},{text:"That leaves x = 4. Check by putting it back: 4 + 3 = 7 \u2713.",svg:Le("x","4")}]},{id:"exponents",title:"Exponents",emoji:"\u2B06\uFE0F",grades:[6,7,8],topic:"exponent",steps:[{text:"An exponent is a shortcut for multiplying a number by itself. The little number says how many times.",svg:zt(2,3)},{text:"5\xB2 ('5 squared') = 5 \xD7 5 = 25. The exponent 2 means use it twice.",svg:zt(5,2)},{text:"Careful: 2\xB3 is 2 \xD7 2 \xD7 2 = 8, NOT 2 \xD7 3. Exponents multiply, they don't add.",svg:zt(2,4)}]},{id:"integers_line",title:"Integers on a Number Line",emoji:"\u{1F321}\uFE0F",grades:[6,7,8],topic:"integers",steps:[{text:"Integers include negative numbers \u2014 like temperatures below zero. They live to the LEFT of 0 on the number line.",svg:G(-6,6,[{v:-4,label:"\u22124"},{v:3,label:"+3"}])},{text:"Adding moves you RIGHT. Start at \u22123 and add 5: move 5 steps right, landing on +2. So \u22123 + 5 = 2.",svg:G(-6,6,[{v:-3,label:"start"},{v:2,label:"\u22123+5",color:"var(--good)"}])},{text:"Subtracting moves you LEFT. The farther left, the smaller the number: \u22125 is less than \u22121.",svg:G(-6,6,[{v:-5,label:"\u22125"},{v:-1,label:"\u22121"}])}]},{id:"integer_signs",title:"Multiplying Integers (Signs)",emoji:"\u2716\uFE0F",grades:[7,8,9],topic:"integers",steps:[{text:"When you multiply or divide, the SIGNS decide if the answer is positive or negative.",svg:F(A(320/2,55,"same signs \u2192 +",{size:16,fill:y.good})+A(320/2,90,"different signs \u2192 \u2212",{size:16,fill:y.b}),120)},{text:"Same signs make a POSITIVE: (\u22124) \xD7 (\u22123) = +12, and 4 \xD7 3 = 12.",svg:F(A(320/2,60,"(\u22124) \xD7 (\u22123) = +12",{size:18}),100)},{text:"Different signs make a NEGATIVE: (\u22124) \xD7 3 = \u221212, and 12 \xF7 (\u22124) = \u22123.",svg:F(A(320/2,60,"(\u22124) \xD7 3 = \u221212",{size:18,fill:y.b}),100)}]},{id:"ratios",title:"Ratios & Proportions",emoji:"\u2697\uFE0F",grades:[6,7],topic:"ratio",steps:[{text:"A ratio compares amounts. A 2:3 ratio of blue to gold means 2 parts blue for every 3 parts gold \u2014 5 parts in all.",svg:Ft([2,3],"blue : gold = 2 : 3")},{text:"Proportions keep the ratio the same as the numbers grow. 2:3 is the same as 4:6 and 6:9 \u2014 multiply both sides equally.",svg:Ft([4,6],"4 : 6 (same as 2 : 3)")},{text:"To split 15 in a 2:3 ratio: 2 + 3 = 5 parts, each part = 15 \xF7 5 = 3, so the amounts are 6 and 9.",svg:Ft([6,9],"6 : 9 \u2014 split of 15")}]},{id:"coordplane",title:"The Coordinate Plane",emoji:"\u{1F4CD}",grades:[6,7,8],topic:"slope",steps:[{text:"Two number lines cross to make a grid. The flat one is the x-axis, the upright one is the y-axis; they meet at (0, 0).",svg:Be({pts:[[0,0,"(0,0)"]]})},{text:"A point is written (x, y): go ACROSS x first, then UP y. Here is (3, 2): right 3, up 2.",svg:Be({pts:[[3,2,"(3,2)"]]})},{text:"Negative coordinates go left or down. (\u22124, \u22123) means left 4, down 3.",svg:Be({pts:[[-4,-3,"(\u22124,\u22123)"],[3,2,"(3,2)"]]})}]},{id:"sqroots",title:"Square Roots",emoji:"\u2733\uFE0F",grades:[8,9],topic:"roots",steps:[{text:"Squaring means multiplying a number by itself: 4\xB2 = 4 \xD7 4 = 16. A square root undoes that.",svg:Wt(4)},{text:"\u221A16 asks 'what number times itself makes 16?' \u2014 it's 4. The area of this square is 16, and each side is \u221A16 = 4.",svg:Wt(4)},{text:"\u221A49 = 7 because 7 \xD7 7 = 49. Perfect squares (like 1, 4, 9, 16, 25, 36, 49) have whole-number roots.",svg:Wt(7)}]},{id:"slope_line",title:"Slope of a Line",emoji:"\u2197\uFE0F",grades:[8,9],topic:"slope",steps:[{text:"Slope measures how steep a line is: rise \xF7 run (how far UP for each step ACROSS).",svg:Be({line:[[-2,-1],[2,3]],pts:[[-2,-1],[2,3]]})},{text:"From (1, 1) to (3, 7): the line rises 6 and runs 2, so slope = 6 \xF7 2 = 3. A bigger slope is steeper.",svg:Be({line:[[-1,-3],[2,3]],pts:[[1,1,"(1,1)"],[2,3,"(2,3)"]]})},{text:"A line going DOWN to the right has a NEGATIVE slope. A flat line has slope 0.",svg:Be({line:[[-3,3],[3,-3]]})}]},{id:"pythagoras",title:"The Pythagorean Theorem",emoji:"\u{1F4D0}",grades:[8,9,10],topic:"pythag",steps:[{text:"In a RIGHT triangle, the two short sides are 'legs' (a and b) and the longest side, opposite the right angle, is the 'hypotenuse' (c).",svg:Rt(3,4,5)},{text:"The rule: a\xB2 + b\xB2 = c\xB2. For legs 3 and 4: 3\xB2 + 4\xB2 = 9 + 16 = 25, and c = \u221A25 = 5.",svg:Rt(3,4,5)},{text:"It works for any right triangle. Legs 6 and 8: 36 + 64 = 100, so the hypotenuse is \u221A100 = 10.",svg:Rt(6,8,10)}]},{id:"twosided",title:"Solving Two-Sided Equations",emoji:"\u{1F7F0}",grades:[9],topic:"linear2",steps:[{text:"When x is on BOTH sides, first gather the x's on one side. Keep the equation balanced \u2014 do the same to both sides.",svg:Le("5x + 1","2x + 7")},{text:"Subtract 2x from both sides: 5x \u2212 2x + 1 = 7, which is 3x + 1 = 7.",svg:Le("3x + 1","7")},{text:"Now subtract 1, then divide by 3: 3x = 6, so x = 2. Check: 5(2)+1 = 11 and 2(2)+7 = 11 \u2713.",svg:Le("x","2")}]},{id:"quadratics",title:"Quadratics & Parabolas",emoji:"\u{1F4C8}",grades:[9,10,11],topic:"quadratic",steps:[{text:"A quadratic (with an x\xB2) graphs as a U-shaped curve called a parabola.",svg:Ct(-2,2)},{text:"The 'solutions' (or roots) are where the curve crosses the x-axis. x\xB2 \u2212 5x + 6 = 0 factors as (x\u22122)(x\u22123), so it crosses at x = 2 and x = 3.",svg:Ct(2,3)},{text:"If it never touches the x-axis, there are no real solutions. The quadratic formula x = (\u2212b \xB1 \u221A(b\xB2\u22124ac)) \xF7 2a solves any of them.",svg:Ct(1,4)}]},{id:"place_compare",title:"Comparing Numbers",emoji:"\u2696\uFE0F",grades:[1,2,3],topic:"place",steps:[{text:"To compare numbers, look at the digits from the LEFT. More tens means a bigger number.",svg:G(20,30,[{v:24,label:"24"},{v:28,label:"28",color:y.b}])},{text:"28 is farther right than 24, so 28 > 24 (28 is greater). The '>' sign always opens to the bigger number.",svg:pe(28)},{text:"If the tens match, compare the ones. 24 and 28 both have 2 tens, but 8 ones beats 4 ones."}]},{id:"rounding_ten",title:"Rounding to the Nearest Ten",emoji:"\u{1F3AF}",grades:[3,4],topic:"place",steps:[{text:"Rounding finds the closest ten. Look at the ones digit: 1\u20134 rounds DOWN, 5\u20139 rounds UP.",svg:G(20,30,[{v:23,label:"23"}])},{text:"23 is closer to 20 (its ones digit 3 is less than 5), so 23 rounds to 20.",svg:G(20,30,[{v:23,label:"23"},{v:20,label:"\u219220",color:y.good}])},{text:"But 27 rounds UP to 30, because 7 is 5 or more. Rounding makes numbers easier to add in your head."}]},{id:"add_numberline",title:"Adding on a Number Line",emoji:"\u2795",grades:[0,1,2],topic:"add",steps:[{text:"You can add by hopping forward on a number line. For 5 + 3, start at 5.",svg:G(0,10,[{v:5,label:"start"}])},{text:"Hop forward 3 steps \u2014 6, 7, 8 \u2014 and you land on 8. So 5 + 3 = 8!",svg:G(0,10,[{v:5,label:"5"},{v:8,label:"+3",color:y.good}])},{text:"Adding always moves you RIGHT (bigger). The more you add, the farther you hop."}]},{id:"doubles",title:"Doubles Facts",emoji:"\u{1F46F}",grades:[1,2],topic:"add",steps:[{text:"A 'double' adds a number to itself, like 4 + 4. Picture two equal rows.",svg:me(2,4)},{text:"4 + 4 = 8. Doubles are worth memorizing \u2014 they make lots of other sums quick.",svg:me(2,4)},{text:"Near-doubles use them too: 4 + 5 is just 4 + 4 and one more = 9."}]},{id:"fact_families",title:"Fact Families",emoji:"\u{1F46A}",grades:[1,2],topic:"add",steps:[{text:"Three numbers make a 'fact family'. Take 3, 5, and 8.",svg:me(1,8)},{text:"You get FOUR facts: 3 + 5 = 8, 5 + 3 = 8, 8 \u2212 3 = 5, and 8 \u2212 5 = 3.",svg:pe(8)},{text:"Adding and subtracting are linked \u2014 know one fact and you know the whole family."}]},{id:"sub_numberline",title:"Subtracting on a Number Line",emoji:"\u2796",grades:[1,2],topic:"sub",steps:[{text:"Subtracting means hopping BACKWARD. For 9 \u2212 4, start at 9.",svg:G(0,10,[{v:9,label:"start"}])},{text:"Hop back 4 \u2014 8, 7, 6, 5 \u2014 and you land on 5. So 9 \u2212 4 = 5.",svg:G(0,10,[{v:9,label:"9"},{v:5,label:"\u22124",color:y.b}])},{text:"Subtraction always moves LEFT (smaller). It's the opposite of adding."}]},{id:"skip_count",title:"Skip Counting = Multiplying",emoji:"\u{1F998}",grades:[2,3],topic:"mult",steps:[{text:"Counting by 2s \u2014 2, 4, 6, 8 \u2014 is the same as multiplying by 2.",svg:G(0,10,[{v:2,label:"2"},{v:4,label:"4"},{v:6,label:"6",color:y.b},{v:8,label:"8",color:y.b}])},{text:"Four hops of 2 land on 8, and 4 \xD7 2 = 8. Skip counting builds the times tables.",svg:me(4,2)},{text:"Counting by 5s or 10s works the same way \u2014 each hop is one equal group."}]},{id:"times_patterns",title:"Times Table Patterns",emoji:"\u{1F522}",grades:[3,4],topic:"mult",steps:[{text:"The times tables are full of patterns. The 5s always end in 0 or 5: 5, 10, 15, 20\u2026",svg:me(4,5)},{text:"The 9s have a trick: their digits add up to 9 (18 \u2192 1+8=9, 27 \u2192 2+7=9).",svg:me(3,9)},{text:"Any number times 1 is itself, and times 0 is 0. Spotting patterns makes the tables easy."}]},{id:"div_remainder",title:"Division with Remainders",emoji:"\u{1F36A}",grades:[3,4],topic:"div",steps:[{text:"Sometimes things don't share evenly. Share 7 cookies between 2 friends.",svg:Ne(2,3)},{text:"Each friend gets 3, with 1 left over. That leftover is called the REMAINDER.",svg:Ne(2,3)},{text:"So 7 \xF7 2 = 3 remainder 1. A remainder is always smaller than the number you divide by."}]},{id:"mult_div_opposite",title:"Multiply & Divide are Opposites",emoji:"\u{1F501}",grades:[3,4],topic:"div",steps:[{text:"Multiplying and dividing undo each other. 3 rows of 4 make 12.",svg:me(3,4)},{text:"And 12 shared into 3 groups gives 4 back. So 3 \xD7 4 = 12 and 12 \xF7 3 = 4.",svg:Ne(3,4)},{text:"Know your times tables and you already know the matching division facts!"}]},{id:"frac_compare",title:"Comparing Fractions",emoji:"\u2696\uFE0F",grades:[3,4,5],topic:"fraction",steps:[{text:"To compare fractions, picture them as bars. Which is bigger, 1/2 or 1/3?",svg:Oe(1,2,1,3,"1/2","1/3")},{text:"1/2 fills more of the bar, so 1/2 > 1/3. Fewer pieces means each piece is bigger.",svg:Oe(1,2,1,3,"1/2","1/3")},{text:"When the bottom numbers match, just compare the tops: 3/5 is bigger than 2/5."}]},{id:"frac_half_bench",title:"More or Less Than a Half?",emoji:"\u{1F317}",grades:[3,4],topic:"fraction",steps:[{text:"A handy trick: compare a fraction to one half. Here is 3/4 shaded.",svg:Ke(3,4,"3/4")},{text:"Half of 4 is 2. Since 3 is more than 2, 3/4 is MORE than a half.",svg:Ke(2,4,"one half")},{text:"Comparing to 1/2 helps you estimate fractions quickly, without exact math."}]},{id:"frac_of_group",title:"A Fraction of a Group",emoji:"\u{1F36C}",grades:[3,4],topic:"fraction",steps:[{text:"Fractions work on groups too. To find 1/3 of 9, split 9 into 3 equal groups.",svg:Ne(3,3)},{text:"Each group holds 3, so 1/3 of 9 = 3. The bottom number tells how many groups to make.",svg:Ne(3,3)},{text:"For 2/3 of 9, take TWO of those groups: 2 \xD7 3 = 6."}]},{id:"percent_intro",title:"Percent Means Out of 100",emoji:"\u{1F4AF}",grades:[4,5],topic:"percent",steps:[{text:"'Percent' means 'out of 100'. This whole grid is 100 squares \u2014 that's 100%.",svg:le(100,"100 of 100 = 100%")},{text:"Shade 25 squares and you have 25% \u2014 a quarter of the whole.",svg:le(25,"25 of 100 = 25%")},{text:"50 squares is 50%. A percent is just a special fraction with 100 on the bottom."}]},{id:"percent_common",title:"Half, Quarter, Tenth",emoji:"\u{1F51F}",grades:[5,6],topic:"percent",steps:[{text:"Some percents are worth memorizing. 50% is one half.",svg:le(50,"50% = one half")},{text:"10% is one tenth \u2014 just one strip of the grid.",svg:le(10,"10% = one tenth")},{text:"Knowing these lets you work in your head: 10% of 80 is 8, so 20% is 16."}]},{id:"money_coins",title:"Coin Values",emoji:"\u{1FA99}",grades:[0,1,2],topic:"money",steps:[{text:"Each coin has its own value in cents.",svg:Na([{label:"penny",val:"1\xA2",color:"#b45309"},{label:"nickel",val:"5\xA2",color:"#94a3b8"},{label:"dime",val:"10\xA2",color:"#64748b"},{label:"quarter",val:"25\xA2",color:"#a1a1aa"}])},{text:"A penny is 1\xA2, a nickel 5\xA2, a dime 10\xA2, and a quarter 25\xA2. Bigger value isn't always a bigger coin!"},{text:"To count money, add up the values \u2014 and start with the biggest coins."}]},{id:"money_change",title:"Making Change",emoji:"\u{1F4B5}",grades:[2,3],topic:"money",steps:[{text:"Change is the money you get back. A toy costs 7\xA2 and you pay 10\xA2.",svg:G(0,10,[{v:7,label:"cost"},{v:10,label:"paid",color:y.b}])},{text:"Count up from the cost to what you paid: 7 \u2192 10 is 3. So the change is 3\xA2.",svg:G(0,10,[{v:7,label:"7"},{v:10,label:"+3",color:y.good}])},{text:"Change = money paid \u2212 cost. Counting up is an easy way to do that subtraction."}]},{id:"time_clock",title:"Reading a Clock",emoji:"\u{1F550}",grades:[1,2,3],topic:"time",steps:[{text:"A clock has two hands. The SHORT hand points to the hour.",svg:Ht(3,0)},{text:"The LONG hand points to the minutes. Straight up (12) means o'clock. This shows 3 o'clock.",svg:Ht(3,0)},{text:"When the long hand points to 6, it's half past \u2014 30 minutes. This clock reads 3:30.",svg:Ht(3,30)}]},{id:"time_units",title:"Minutes, Hours, Days",emoji:"\u23F3",grades:[2,3],topic:"time",steps:[{text:"Units of time fit inside each other.",svg:F(A(160,45,"60 seconds = 1 minute",{size:15})+A(160,75,"60 minutes = 1 hour",{size:15})+A(160,105,"24 hours = 1 day",{size:15}),130)},{text:"So an hour is 60 minutes, a day is 24 hours, and a week is 7 days."},{text:"To change hours to minutes, multiply by 60: 2 hours = 2 \xD7 60 = 120 minutes."}]},{id:"measure_length",title:"Measuring Length",emoji:"\u{1F4CF}",grades:[1,2,3],topic:"measure",steps:[{text:"We measure how long things are with units like centimeters. A ruler is really a number line!",svg:G(0,10,[{v:6,label:"6 cm",color:y.b}])},{text:"Line one end up at 0 and read the number at the other end. This pencil reaches 6, so it's 6 cm.",svg:G(0,10,[{v:6,label:"6"}])},{text:"Always start at 0! Starting at 1 by mistake makes your measurement off by one."}]},{id:"decimal_money",title:"Decimals are Like Money",emoji:"\u{1F4B0}",grades:[4,5],topic:"decimal",steps:[{text:"Decimals split a whole into 10 or 100 parts \u2014 just like a dollar splits into 100 cents.",svg:le(100,"$1.00 = 100 cents")},{text:"$0.25 is 25 hundredths of a dollar \u2014 the same 25 squares as 25%.",svg:le(25,"$0.25 = 25 hundredths")},{text:"The first place after the dot is tenths, the second is hundredths. 0.5 and 0.50 are the same amount."}]}];function qs(t){return ft.filter(e=>e.grades.includes(t))}function Is(t){return ft.find(e=>e.id===t)||null}function Pa(t,e){for(t=Math.abs(t),e=Math.abs(e);e;)[t,e]=[e,t%e];return
